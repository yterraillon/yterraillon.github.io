<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support — EnBref</title>
    <meta name="description" content="Contacter le support d’EnBref.">
    <script>
        // Clair ou Sombre, suivi automatiquement : tokens.css bascule sur data-theme.
        (() => {
            const dark = window.matchMedia("(prefers-color-scheme: dark)");
            const apply = () => document.documentElement.dataset.theme = dark.matches ? "dark" : "light";
            apply();
            dark.addEventListener("change", apply);
        })();
    </script>
    <link rel="stylesheet" href="./design-system/tokens.css">
    <link rel="stylesheet" href="./design-system/bundle.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./images/favicons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="./images/favicons/apple-touch-icon.png">
    <link rel="manifest" href="./site.webmanifest">
    <script async src="https://tally.so/widgets/embed.js"></script>
</head>
<body>
    <header class="site-bar">
        <div class="container">
            <a class="brand headline" href="./index.html">
                <img src="./images/favicons/apple-touch-icon.png" alt="" width="36" height="36">
                EnBref
            </a>
            <nav class="site-nav control" aria-label="Navigation principale">
                <a class="nav-optional" href="./index.html#fonctionnalites">Fonctionnalités</a>
                <a href="./support.html">Support</a>
                <span class="soon soon--small footnote nav-optional">Bientôt sur l’App Store</span>
            </nav>
        </div>
    </header>

    <main>
        <div class="container container--narrow">
            <div class="page-head">
                <h1 class="large-title">Support</h1>
            </div>
            <p class="body muted">Une question, un bug, une suggestion&nbsp;? Écrivez-nous avec le formulaire ci-dessous, ou directement à <a href="mailto:support@enbref.app">support@enbref.app</a>.</p>
            <!-- Le formulaire Tally a son propre thème : la carte reste en clair quel que soit le thème du site. -->
            <section class="card" data-theme="light" aria-label="Formulaire de support">
                <iframe class="support-form" data-tally-src="https://tally.so/r/nGPg8e?transparentBackground=1" title="Formulaire de support EnBref" loading="lazy"></iframe>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span class="footnote muted">© 2026 EnBref</span>
            <nav class="footer-links footnote" aria-label="Liens du site">
                <a href="./privacy-policy.html">Confidentialité</a>
                <a href="./terms-of-use.html">CGU</a>
                <a href="./legal-notice.html">Mentions légales</a>
                <a href="./about-us.html">À propos</a>
                <a href="./support.html">Support</a>
                <a href="https://mastodon.social/@enbref" target="_blank" rel="noopener noreferrer">Mastodon</a>
            </nav>
        </div>
    </footer>
</body>
</html>
